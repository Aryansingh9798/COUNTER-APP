<!DOCTYPE html>
<html>
<head>
  <title>Counter App</title>

  <style>

    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#111;
      font-family:Arial;
      color:white;
    }

    .box{
      text-align:center;
      background:#222;
      padding:40px;
      border-radius:20px;
      width:350px;
    }

    h1{
      font-size:50px;
      margin-bottom:20px;
    }

    #count{
      font-size:60px;
      margin:20px;
      color:#00ff88;
    }

    button{
      padding:12px 20px;
      margin:5px;
      border:none;
      border-radius:10px;
      font-size:18px;
      cursor:pointer;
    }

  </style>
</head>

<body>

<div class="box">

  <h1>Counter App 🔢</h1>

  <div id="count">0</div>

  <button onclick="increase()">+</button>

  <button onclick="decrease()">-</button>

  <button onclick="reset()">Reset</button>

</div>

<script>

let count = 0;

function increase(){

  count++;

  document.getElementById("count").innerHTML = count;

}

function decrease(){

  count--;

  document.getElementById("count").innerHTML = count;

}

function reset(){

  count = 0;

  document.getElementById("count").innerHTML = count;

}

</script>

</body>
</html>
